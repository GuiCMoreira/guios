<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1321"/>
      <stop offset="1" stop-color="#1d2a44"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2574c"/>
      <stop offset="0.5" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#3e6fb0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <!-- listras diagonais de poste de barbeiro, bem sutis -->
  <g opacity="0.07">
    <path d="M-100 800 L300 -100 L380 -100 L-20 800 Z" fill="#e2574c"/>
    <path d="M60 800 L460 -100 L540 -100 L140 800 Z" fill="#f4f4f6"/>
    <path d="M220 800 L620 -100 L700 -100 L300 800 Z" fill="#3e6fb0"/>
    <path d="M900 800 L1300 -100 L1380 -100 L980 800 Z" fill="#e2574c"/>
    <path d="M1060 800 L1460 -100 L1540 -100 L1140 800 Z" fill="#f4f4f6"/>
  </g>
  <!-- navalha estilizada -->
  <g transform="translate(540 240) rotate(-28)" stroke="#f4f4f6" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M0 0 L150 0 Q180 0 180 26 L180 34 Q180 60 150 60 L0 60" fill="#f4f4f6" stroke="none"/>
    <path d="M0 8 L-160 52" stroke="url(#pole)" stroke-width="22"/>
    <circle cx="0" cy="30" r="12" fill="#1d2a44" stroke="#f4f4f6" stroke-width="6"/>
  </g>
  <text x="640" y="470" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#f4f4f6" letter-spacing="-2">NavalhaGo</text>
  <text x="640" y="530" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#9db1d4">Agenda e gestão para barbearias · SaaS multi-tenant</text>
  <g transform="translate(640 600)">
    <rect x="-150" y="-26" width="300" height="52" rx="26" fill="none" stroke="#9db1d4" stroke-opacity="0.5" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#cdd9ee" letter-spacing="2">EM DESENVOLVIMENTO</text>
  </g>
